name: finsecure-linux-microsegmentation

services:
  client:
    build:
      context: ./tools
    container_name: finsecure-client
    hostname: client
    command: ["sleep", "infinity"]
    networks:
      finsecure_net:
        ipv4_address: 172.28.0.10

  attacker:
    build:
      context: ./tools
    container_name: finsecure-attacker
    hostname: attacker
    command: ["sleep", "infinity"]
    networks:
      finsecure_net:
        ipv4_address: 172.28.0.50

  frontend:
    build:
      context: ./frontend
    container_name: finsecure-frontend
    hostname: frontend
    cap_add:
      - NET_ADMIN
    networks:
      finsecure_net:
        ipv4_address: 172.28.0.20
    ports:
      - "80:80"
    volumes:
      - ./policies:/policies:ro
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ./backend
    container_name: finsecure-backend
    hostname: backend
    cap_add:
      - NET_ADMIN
    networks:
      finsecure_net:
        ipv4_address: 172.28.0.30
    volumes:
      - ./policies:/policies:ro
    depends_on:
      database:
        condition: service_healthy

  database:
    build:
      context: ./database
    container_name: finsecure-database
    hostname: database
    cap_add:
      - NET_ADMIN
    environment:
      POSTGRES_DB: finsecure
      POSTGRES_USER: finuser
      POSTGRES_PASSWORD: FinSecureLab2026!
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finuser -d finsecure"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      finsecure_net:
        ipv4_address: 172.28.0.40
    volumes:
      - ./policies:/policies:ro
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - finsecure_pgdata:/var/lib/postgresql/data

networks:
  finsecure_net:
    name: finsecure-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  finsecure_pgdata: